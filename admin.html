<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coordinator Portal | Vista Geomatics</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="portal.css"></head><body><main class="page"><div class="top"><img class="logo" src="assets/vista-logo-white.png"><a class="back" href="portal.html">Client Portal</a></div><section class="shell"><header class="hero"><p class="eyebrow">Coordinator Access</p><h1>Document <strong>delivery</strong></h1><p class="lead">Sign in, create a job, generate its private access code, and upload the customer document.</p></header><div class="panel" id="loginPanel"><form id="login"><div class="grid"><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" required></div></div><div class="actions"><button>Sign In</button></div><div id="loginStatus" class="status"></div></form></div><div class="panel hidden" id="adminPanel"><form id="create"><div class="grid"><div class="field"><label>Project / Job Number</label><input id="job" required placeholder="VG-2026-00123"></div><div class="field"><label>Customer / Reference</label><input id="customer" placeholder="Optional"></div><div class="field full"><label>Document</label><input id="file" type="file" required></div></div><div class="actions"><button type="button" id="generate">Generate Access Code</button><button type="submit">Upload & Publish</button><button type="button" class="secondary" id="logout">Sign Out</button></div><div id="generated" class="status"></div><div id="adminStatus" class="status"></div></form></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const cfg=window.VISTA_PORTAL_CONFIG||{};let sb,accessCode='';const loginPanel=document.querySelector('#loginPanel'),adminPanel=document.querySelector('#adminPanel');
function msg(el,t,e=false){el.textContent=t;el.className='status show'+(e?' error':'')}
function code(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=new Uint32Array(12);crypto.getRandomValues(r);return [...r].map((n,i)=>a[n%a.length]+([3,7].includes(i)?'-':'')).join('')}
async function init(){if(!cfg.supabaseUrl||cfg.supabaseUrl.startsWith('PASTE_'))return msg(document.querySelector('#loginStatus'),'Add your Supabase URL and anon key in config.js before using the live demo.',true);sb=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);const {data}=await sb.auth.getSession();toggle(!!data.session)}function toggle(on){loginPanel.classList.toggle('hidden',on);adminPanel.classList.toggle('hidden',!on)}
document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error)return msg(loginStatus,error.message,true);toggle(true)};
document.querySelector('#generate').onclick=()=>{accessCode=code();msg(generated,'Access code: '+accessCode)};
document.querySelector('#logout').onclick=async()=>{await sb.auth.signOut();toggle(false)};
document.querySelector('#create').onsubmit=async e=>{e.preventDefault();if(!accessCode)accessCode=code();const f=file.files[0],jobNo=job.value.trim();if(!f)return;msg(adminStatus,'Uploading…');try{const bytes=new TextEncoder().encode(accessCode.toUpperCase());const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))).map(b=>b.toString(16).padStart(2,'0')).join('');const path=crypto.randomUUID()+'/'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');let {error}=await sb.storage.from('client-documents').upload(path,f,{upsert:false});if(error)throw error;({error}=await sb.from('documents').insert({job_number:jobNo,customer_reference:customer.value.trim()||null,file_name:f.name,storage_path:path,access_code_hash:hash}));if(error)throw error;msg(generated,'Access code: '+accessCode+' — copy this for the customer.');msg(adminStatus,'Published successfully.');e.target.reset();accessCode=''}catch(err){msg(adminStatus,err.message,true)}};init();
</script></body></html>
