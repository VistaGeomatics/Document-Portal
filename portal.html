<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Document Portal | Vista Geomatics</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="portal.css"></head><body><main class="page"><div class="top"><img class="logo" src="assets/vista-logo-white.png" alt="Vista Geomatics"><a class="back" href="index.html">Back to website</a></div><section class="shell"><header class="hero"><p class="eyebrow">Secure Client Delivery</p><h1>Retrieve your <strong>documents</strong></h1><p class="lead">Enter the project number and private access code supplied by Vista Geomatics. Valid credentials unlock a temporary download link.</p></header><div class="panel"><form id="lookup"><div class="grid"><div class="field"><label for="job">Project / Job Number</label><input id="job" autocomplete="off" required placeholder="VG-2026-00123"></div><div class="field"><label for="code">Access Code</label><input id="code" autocomplete="off" required placeholder="XXXX-XXXX-XXXX"></div></div><div class="actions"><button type="submit">Find Documents</button></div><div id="status" class="status"></div></form><div id="result" class="result"><p class="eyebrow">Document Available</p><div class="doc"><div><strong id="docName"></strong><small id="docMeta"></small></div><a id="download" class="button" href="#">Download</a></div></div></div></section></main><script src="config.js"></script><script>
const cfg=window.VISTA_PORTAL_CONFIG||{};const status=document.querySelector('#status'),result=document.querySelector('#result');
function msg(t,e=false){status.textContent=t;status.className='status show'+(e?' error':'')}
document.querySelector('#lookup').addEventListener('submit',async e=>{e.preventDefault();result.classList.remove('show');if(!cfg.supabaseUrl||cfg.supabaseUrl.startsWith('PASTE_'))return msg('Demo backend is not configured yet. Add the Supabase URL and anon key in config.js.',true);msg('Checking secure access…');try{const r=await fetch(cfg.supabaseUrl+'/functions/v1/lookup-document',{method:'POST',headers:{'Content-Type':'application/json','apikey':cfg.supabaseAnonKey,'Authorization':'Bearer '+cfg.supabaseAnonKey},body:JSON.stringify({job_number:document.querySelector('#job').value.trim(),access_code:document.querySelector('#code').value.trim()})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Access denied.');document.querySelector('#docName').textContent=data.file_name;document.querySelector('#docMeta').textContent='Project '+data.job_number+' · link expires in 5 minutes';document.querySelector('#download').href=data.download_url;result.classList.add('show');msg('Access verified. Your secure download is ready.')}catch(err){msg(err.message,true)}});
</script></body></html>
